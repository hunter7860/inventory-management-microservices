server.port=8087

# ===============================
# MySQL Database Configuration
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/dbpurchase?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# Hibernate / JPA Settings
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.sql.init.mode=never

# ===============================
# Microservice Consumer URLs
# ===============================
# Material Service (Running on Port 8089)
MaterialServiceConsumer.serviceURL=http://localhost:8089

MaterialCategoryConsumer.apiURL=/material/controller/getMaterialCategories
MaterialCategoryConsumer.apiURLForById=/material/controller/getMaterialCategories/

MaterialTypeConsumer.apiURL=/type/controller/getTypeDetails
MaterialTypeConsumer.apiURLByCategoryId=/type/controller/getTypeDetailsByCategoryId/

UnitServiceConsumer.apiURL=/unit/controller/getUnitDetails
UnitServiceConsumer.apiURLByCategoryId=/unit/controller/getUnitsByCategoryId/

# Vendor Service (Running on Port 8088)
VendorServiceConsumer.serviceURL=http://localhost:8088
VendorServiceConsumer.apiURL=/controller/getVendors